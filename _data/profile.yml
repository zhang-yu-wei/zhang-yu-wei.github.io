short_bio: >-
  <p>
    I am a Ph.D. student at the
    <a href="https://datascience.ucsd.edu/" target="_blank">Halıcıoğlu Data Science Institute, UC San Diego</a>,
    advised by <a href="https://shangjingbo1226.github.io/" target="_blank">Prof. Jingbo Shang</a>.
    My research focuses on <b>LLM post-training, continual adaptation, and memory</b>.
  </p>
  <p>
    I am especially interested in how language models can improve after pretraining: learning from limited task data,
    rare success signals, long-horizon feedback, and persistent context while retaining prior knowledge.
    My recent work studies <a href="https://arxiv.org/abs/2505.12306" target="_blank">knowledge injection</a>,
    <a href="https://arxiv.org/abs/2605.12741" target="_blank">on-policy self-distillation / reinforcement learning</a>,
    and <a href="https://arxiv.org/abs/2605.30842" target="_blank">memory-based context management</a>.
  </p>

